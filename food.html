<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>實習中餐店 - 點餐 POS 系統</title>
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    /* 適配行動裝置底部安全區域 (iOS Home Indicator) */
    .safe-bottom {
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-amber-50/40 text-slate-800 min-h-dvh flex flex-col">

  <!-- ==================== 頂部導覽列 (Header) ==================== -->
  <header class="sticky top-0 z-30 bg-gradient-to-r from-amber-500 to-orange-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
      
      <!-- 左側：返回首頁按鈕 -->
      <a href="index.html" 
         class="inline-flex items-center gap-1 px-3 py-2 rounded-xl bg-white/15 hover:bg-white/25 active:scale-95 transition text-sm font-bold whitespace-nowrap">
        <span>← 回首頁</span>
      </a>

      <!-- 中央：店家名稱 -->
      <h1 class="text-lg sm:text-xl font-black tracking-wide truncate flex items-center gap-1.5">
        <span>🍱</span>
        <span>實習中餐店</span>
      </h1>

      <!-- 右側：重置/清空購物車按鈕 -->
      <button id="reset-btn" 
              type="button"
              onclick="clearCartWithConfirm()"
              disabled
              class="inline-flex items-center gap-1 px-3 py-2 rounded-xl bg-white/15 hover:bg-rose-600/90 active:scale-95 transition text-sm font-bold whitespace-nowrap disabled:opacity-40 disabled:pointer-events-none">
        <span>🗑️ 清空</span>
      </button>

    </div>
  </header>

  <!-- ==================== 主內容區：菜單網格 ==================== -->
  <!-- 預留充足底部內距 (pb-32)，確保最後一排餐點不會被底部固定浮動列遮擋 -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 pt-5 pb-32">
    
    <!-- 提示小標 -->
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <p class="text-xs sm:text-sm font-bold text-amber-900 bg-amber-100/80 px-3 py-1 rounded-full">
        ✨ 點擊「+」選擇辣度、加量與忌口備註
      </p>
      <span id="menu-count-badge" class="text-xs text-slate-500 font-medium"></span>
    </div>

    <!-- 動態渲染的菜單網格容器（手機 2 欄，平板 3 欄，電腦 4 欄） -->
    <section id="menu-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5 sm:gap-5">
      <!-- 由 JavaScript 動態產生卡片 -->
    </section>

  </main>

  <!-- ==================== 底部固定浮動列 (Sticky Bottom Bar) ==================== -->
  <div class="fixed bottom-0 inset-x-0 z-30 bg-white/85 backdrop-blur-md border-t border-amber-100 shadow-[0_-8px_25px_-5px_rgba(0,0,0,0.08)] safe-bottom pt-3 px-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      
      <!-- 左側：累計總數量與總金額 -->
      <div class="flex items-center gap-3">
        <div class="relative flex items-center justify-center w-12 h-12 rounded-2xl bg-amber-50 text-orange-600 font-black text-xl border border-amber-200/60">
          🧾
          <!-- 數量徽章 -->
          <span id="total-qty-badge" 
                class="absolute -top-1.5 -right-1.5 min-w-[22px] h-[22px] px-1 rounded-full bg-orange-600 text-white text-xs font-bold flex items-center justify-center shadow-sm transition-transform">
            0
          </span>
        </div>
        <div>
          <div class="text-xs text-slate-500 font-medium">
            已選 <span id="total-qty-text" class="font-bold text-orange-700">0</span> 份餐點
          </div>
          <div class="text-lg sm:text-xl font-black text-slate-900 leading-tight">
            NT$ <span id="total-price-text">0</span>
          </div>
        </div>
      </div>

      <!-- 右側：查看明細 / 結帳按鈕 -->
      <button id="checkout-btn"
              type="button"
              onclick="openCheckoutModal()"
              disabled
              class="px-5 sm:px-7 h-12 rounded-2xl font-bold text-sm sm:text-base text-white bg-gradient-to-r from-amber-500 to-orange-600 shadow-md shadow-orange-500/25 hover:from-amber-600 hover:to-orange-700 active:scale-95 transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none disabled:active:scale-100 whitespace-nowrap">
        查看明細 / 結帳
      </button>

    </div>
  </div>

  <!-- ==================== 餐點客製化選擇彈窗 (Customization Modal) ==================== -->
  <div id="custom-modal" 
       class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 sm:p-4 transition-opacity">
    
    <!-- 點擊背景遮罩關閉 -->
    <div class="absolute inset-0" onclick="closeCustomModal()"></div>

    <!-- 彈窗主體 -->
    <div class="relative z-10 w-full max-w-lg bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[88dvh]">
      
      <!-- 頂部：餐點名稱與關閉按鈕 -->
      <div class="px-6 py-4 bg-gradient-to-r from-amber-500 to-orange-600 text-white flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-amber-100 block">餐點客製化設定</span>
          <h2 id="custom-modal-title" class="text-lg sm:text-xl font-extrabold tracking-wide">餐點名稱</h2>
        </div>
        <button type="button" 
                onclick="closeCustomModal()"
                aria-label="關閉客製化視窗"
                class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 active:scale-90 flex items-center justify-center font-bold text-lg transition">
          ✕
        </button>
      </div>

      <!-- 中間：客製化選項區（可捲動） -->
      <div class="p-5 overflow-y-auto flex-1 space-y-5">
        
        <!-- 1. 辣度選擇（單選：不辣、小辣、中辣、大辣） -->
        <div>
          <div class="flex items-center justify-between mb-2.5">
            <label class="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
              <span>🌶️ 辣度選擇</span>
            </label>
            <span class="text-xs font-bold text-orange-700 bg-amber-50 px-2 py-0.5 rounded-full">必選單選</span>
          </div>
          <div id="spice-options-container" class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <!-- 由 JS 動態產生辣度按鈕 -->
          </div>
        </div>

        <!-- 2. 加量 / 加點加價區（可複選） -->
        <div>
          <div class="flex items-center justify-between mb-2.5">
            <label class="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
              <span>🍳 加量 / 加點加價</span>
            </label>
            <span class="text-xs font-medium text-slate-400">可複選（不加可略過）</span>
          </div>
          <div id="addon-options-container" class="grid grid-cols-2 gap-2">
            <!-- 由 JS 動態產生加點按鈕 -->
          </div>
        </div>

        <!-- 3. 飲食忌口與廚房備註（免費複選） -->
        <div>
          <div class="flex items-center justify-between mb-2.5">
            <label class="text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
              <span>🌿 忌口與廚房備註</span>
            </label>
            <span class="text-xs font-medium text-slate-400">免費可複選</span>
          </div>
          <div id="note-options-container" class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <!-- 由 JS 動態產生忌口按鈕 -->
          </div>
        </div>

        <!-- 4. 本次點購份數 -->
        <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
          <span class="text-sm font-extrabold text-slate-800">本組客製化份數</span>
          <div class="flex items-center gap-3">
            <button id="custom-qty-minus"
                    type="button"
                    onclick="changeCustomModalQty(-1)"
                    class="w-10 h-10 rounded-xl font-black text-lg flex items-center justify-center bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-90 transition disabled:opacity-40 disabled:cursor-not-allowed">
              −
            </button>
            <span id="custom-qty-display" class="font-black text-lg text-slate-900 min-w-[2rem] text-center">1</span>
            <button type="button"
                    onclick="changeCustomModalQty(1)"
                    class="w-10 h-10 rounded-xl font-black text-lg flex items-center justify-center bg-orange-500 text-white hover:bg-orange-600 active:scale-90 transition">
              +
            </button>
          </div>
        </div>

      </div>

      <!-- 下方：即時小計與確認加入購物車按鈕 -->
      <div class="p-5 bg-slate-50 border-t border-slate-200/80 safe-bottom">
        <div class="flex items-center justify-between mb-3 text-xs text-slate-500">
          <span>已選規格：<strong id="custom-summary-preview" class="text-orange-700">不辣</strong></span>
          <span>單份 <strong id="custom-unit-price" class="text-slate-800">NT$ 0</strong></span>
        </div>
        <button type="button"
                onclick="confirmAddCustomToCart()"
                class="w-full h-12 rounded-xl font-bold text-white bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 shadow-md shadow-orange-500/20 active:scale-[0.99] transition flex items-center justify-center gap-2 text-base">
          <span>確認加入購物車</span>
          <span>（NT$ <span id="custom-total-price">0</span>）</span>
        </button>
      </div>

    </div>
  </div>

  <!-- ==================== 結帳明細彈窗 (Checkout Modal) ==================== -->
  <div id="checkout-modal" 
       class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 sm:p-4 transition-opacity">
    
    <!-- 點擊背景遮罩關閉 -->
    <div class="absolute inset-0" onclick="closeCheckoutModal()"></div>

    <!-- 彈窗主體（手機版由底部滑出 Bottom Sheet，電腦版置中 Modal） -->
    <div class="relative z-10 w-full max-w-xl bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85dvh]">
      
      <!-- 頂部：標題與關閉按鈕 (X) -->
      <div class="px-6 py-4 bg-gradient-to-r from-amber-500 to-orange-600 text-white flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">🍱</span>
          <h2 class="text-lg font-extrabold tracking-wide">訂單明細（實習中餐店）</h2>
        </div>
        <button type="button" 
                onclick="closeCheckoutModal()"
                aria-label="關閉明細視窗"
                class="w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 active:scale-90 flex items-center justify-center font-bold text-lg transition">
          ✕
        </button>
      </div>

      <!-- 中間：明細表格列表（可捲動） -->
      <div class="p-5 overflow-y-auto flex-1">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-xs font-bold text-slate-400 uppercase">
              <th class="pb-2.5">品名與客製規格</th>
              <th class="pb-2.5 text-right whitespace-nowrap">單價</th>
              <th class="pb-2.5 text-center whitespace-nowrap">數量</th>
              <th class="pb-2.5 text-right whitespace-nowrap">小計</th>
            </tr>
          </thead>
          <tbody id="modal-order-list" class="divide-y divide-slate-100 text-sm">
            <!-- 由 JavaScript 動態插入數量 > 0 的品項與客製規格 -->
          </tbody>
        </table>
      </div>

      <!-- 下方：總計金額與底部操作按鈕 -->
      <div class="p-5 bg-slate-50 border-t border-slate-200/80 safe-bottom">
        <div class="flex items-baseline justify-between mb-4">
          <span class="text-sm font-bold text-slate-500">總計份數：<span id="modal-total-qty" class="text-slate-800">0</span> 份</span>
          <div class="text-xl sm:text-2xl font-black text-orange-700">
            總計金額：NT$ <span id="modal-total-price">0</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button type="button"
                  onclick="closeCheckoutModal()"
                  class="h-12 rounded-xl font-bold text-slate-700 bg-white border border-slate-300 hover:bg-slate-100 active:scale-95 transition">
            繼續加點
          </button>
          <button type="button"
                  onclick="submitOrder()"
                  class="h-12 rounded-xl font-bold text-white bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 shadow-md shadow-orange-500/20 active:scale-95 transition">
            確認送單
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- ==================== JavaScript 核心邏輯 ==================== -->
  <script>
    /**
     * 1. 菜單與客製化選項資料定義（Data-driven UI）
     */
    const menuData = [
      {
        id: 'food-1',
        name: '懷舊滷排骨便當',
        price: 110,
        image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'food-2',
        name: '脆皮炸雞腿便當',
        price: 120,
        image: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'food-3',
        name: '紅燒半筋半肉牛肉麵',
        price: 150,
        image: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'food-4',
        name: '古早味瓜仔魯肉飯',
        price: 45,
        image: 'https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'food-5',
        name: '手工鮮肉煎餃 (8顆)',
        price: 65,
        image: 'https://images.unsplash.com/photo-1496116218417-1a781b1c416c?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'food-6',
        name: '蒜香清炒季節時蔬',
        price: 50,
        image: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'food-7',
        name: '主廚黃金蝦仁炒飯',
        price: 100,
        image: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 'food-8',
        name: '招牌酸辣湯',
        price: 40,
        image: 'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=600&q=80'
      }
    ];

    // 辣度選項（不辣、小辣、中辣、大辣）
    const spiceOptions = ['不辣', '小辣', '中辣', '大辣'];

    // 加量 / 加點加價選項
    const addonOptions = [
      { id: 'add-rice', name: '加飯/加麵', price: 10 },
      { id: 'add-egg', name: '加滷蛋', price: 15 },
      { id: 'add-tofu', name: '加油豆腐', price: 15 },
      { id: 'add-veggie', name: '加青菜', price: 20 }
    ];

    // 飲食忌口與廚房備註選項（免費複選）
    const noteOptions = ['不加蔥', '不加香菜', '不加蒜', '飯少/醬少'];

    /**
     * 2. 狀態管理：
     * - cart: 統計每個商品的總數量 { 'food-1': 2, ... }，用於快速更新菜單卡片與 [-] 按鈕狀態
     * - cartDetails: 儲存每一筆含客製化規格的訂單明細陣列
     *   元素結構：{ key, itemId, name, basePrice, unitPrice, spice, addons: [], notes: [], qty }
     */
    const cart = {};
    let cartDetails = [];

    // 當前正在客製化彈窗中編輯的暫存狀態
    let currentCustomState = {
      item: null,
      spice: '不辣',
      addons: [], // 存放選中的 addon id
      notes: [],  // 存放選中的忌口字串
      qty: 1
    };

    // 初始化購物車數量為 0
    function initCart() {
      menuData.forEach(item => {
        cart[item.id] = 0;
      });
      cartDetails = [];
    }

    // 根據 cartDetails 重新同步每個 itemId 的總數量到 cart 物件
    function syncCartCounts() {
      menuData.forEach(item => {
        cart[item.id] = 0;
      });
      cartDetails.forEach(entry => {
        cart[entry.itemId] = (cart[entry.itemId] || 0) + entry.qty;
      });
    }

    /**
     * 3. 初始渲染菜單卡片網格
     */
    function renderMenuGrid() {
      const gridEl = document.getElementById('menu-grid');
      const countBadgeEl = document.getElementById('menu-count-badge');
      countBadgeEl.textContent = `共 ${menuData.length} 道餐點`;

      gridEl.innerHTML = menuData.map(item => `
        <article class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-amber-100/80 flex flex-col justify-between transition hover:shadow-md">
          <div>
            <!-- 餐點圖片（等比例裁切、具圓角與微陰影） -->
            <div class="aspect-[4/3] w-full overflow-hidden rounded-xl shadow-sm bg-slate-100 mb-3 relative cursor-pointer"
                 onclick="openCustomModal('${item.id}')">
              <img src="${item.image}" 
                   alt="${item.name}" 
                   loading="lazy"
                   class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" />
              <span class="absolute bottom-2 right-2 bg-slate-900/70 backdrop-blur-sm text-white text-[11px] font-bold px-2 py-0.5 rounded-md">
                可客製
              </span>
            </div>

            <!-- 品名與單價 -->
            <h3 class="font-bold text-slate-800 text-sm sm:text-base line-clamp-1">${item.name}</h3>
            <p class="text-orange-600 font-black text-base sm:text-lg mt-0.5">NT$ ${item.price} <span class="text-xs font-normal text-slate-400">起</span></p>
          </div>

          <!-- 數量控制元件：[-] [數量] [+]（按鈕至少 40x40px 符合行動觸控） -->
          <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between gap-2">
            <button id="minus-${item.id}"
                    type="button"
                    onclick="decreaseItemFromCard('${item.id}')"
                    disabled
                    aria-label="減少 ${item.name} 數量"
                    class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl font-black text-lg flex items-center justify-center bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-90 transition disabled:opacity-40 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed disabled:active:scale-100">
              −
            </button>

            <span id="qty-${item.id}" 
                  class="font-black text-base sm:text-lg text-slate-800 min-w-[2rem] text-center select-none">
              0
            </span>

            <button id="plus-${item.id}"
                    type="button"
                    onclick="openCustomModal('${item.id}')"
                    aria-label="新增並客製化 ${item.name}"
                    class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl font-black text-lg flex items-center justify-center bg-orange-500 text-white hover:bg-orange-600 active:scale-90 shadow-sm shadow-orange-500/30 transition">
              +
            </button>
          </div>
        </article>
      `).join('');
    }

    /**
     * 4. 客製化選擇彈窗邏輯（點擊卡片 [+] 時開啟）
     */
    function openCustomModal(itemId) {
      const item = menuData.find(m => m.id === itemId);
      if (!item) return;

      // 重置為預設客製化狀態
      currentCustomState = {
        item: item,
        spice: spiceOptions[0], // 預設「不辣」
        addons: [],
        notes: [],
        qty: 1
      };

      document.getElementById('custom-modal-title').textContent = `${item.name}（NT$ ${item.price}）`;
      renderCustomModalOptions();

      const modalEl = document.getElementById('custom-modal');
      modalEl.classList.remove('hidden');
      modalEl.classList.add('flex');
    }

    function closeCustomModal() {
      const modalEl = document.getElementById('custom-modal');
      modalEl.classList.add('hidden');
      modalEl.classList.remove('flex');
    }

    // 渲染客製化彈窗內的按鈕狀態與價格預覽
    function renderCustomModalOptions() {
      const { item, spice, addons, notes, qty } = currentCustomState;
      if (!item) return;

      // 渲染辣度單選按鈕
      const spiceContainer = document.getElementById('spice-options-container');
      spiceContainer.innerHTML = spiceOptions.map(opt => {
        const active = (spice === opt);
        return `
          <button type="button"
                  onclick="selectSpice('${opt}')"
                  class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold border transition active:scale-95 ${
                    active
                      ? 'bg-orange-600 text-white border-orange-600 shadow-sm'
                      : 'bg-white text-slate-700 border-slate-200 hover:bg-amber-50/60'
                  }">
            ${opt}
          </button>
        `;
      }).join('');

      // 渲染加量/加點複選按鈕
      const addonContainer = document.getElementById('addon-options-container');
      addonContainer.innerHTML = addonOptions.map(addon => {
        const active = addons.includes(addon.id);
        return `
          <button type="button"
                  onclick="toggleAddon('${addon.id}')"
                  class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold border transition flex items-center justify-between active:scale-95 ${
                    active
                      ? 'bg-amber-50 text-orange-800 border-orange-500 ring-1 ring-orange-500'
                      : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                  }">
            <span>${active ? '✓ ' : '+ '}${addon.name}</span>
            <span class="text-orange-600 font-extrabold">+NT$ ${addon.price}</span>
          </button>
        `;
      }).join('');

      // 渲染忌口備註免費複選按鈕
      const noteContainer = document.getElementById('note-options-container');
      noteContainer.innerHTML = noteOptions.map(note => {
        const active = notes.includes(note);
        return `
          <button type="button"
                  onclick="toggleNote('${note}')"
                  class="py-2.5 px-2.5 rounded-xl text-xs sm:text-sm font-bold border transition active:scale-95 ${
                    active
                      ? 'bg-slate-800 text-white border-slate-800 shadow-sm'
                      : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                  }">
            ${active ? '✓ ' : ''}${note}
          </button>
        `;
      }).join('');

      // 更新數量與 [-] 禁用狀態
      document.getElementById('custom-qty-display').textContent = qty;
      document.getElementById('custom-qty-minus').disabled = (qty <= 1);

      // 計算加點總額與單份價格
      const selectedAddonsObjs = addonOptions.filter(a => addons.includes(a.id));
      const addonExtraPrice = selectedAddonsObjs.reduce((sum, a) => sum + a.price, 0);
      const unitPrice = item.price + addonExtraPrice;
      const totalPrice = unitPrice * qty;

      // 規格文字預覽
      const addonText = selectedAddonsObjs.length > 0
        ? ' / ' + selectedAddonsObjs.map(a => a.name).join('、')
        : '';
      const noteText = notes.length > 0
        ? ' / ' + notes.join('、')
        : '';
      document.getElementById('custom-summary-preview').textContent = `${spice}${addonText}${noteText}`;
      document.getElementById('custom-unit-price').textContent = `NT$ ${unitPrice}`;
      document.getElementById('custom-total-price').textContent = totalPrice.toLocaleString();
    }

    function selectSpice(val) {
      currentCustomState.spice = val;
      renderCustomModalOptions();
    }

    function toggleAddon(addonId) {
      const idx = currentCustomState.addons.indexOf(addonId);
      if (idx > -1) {
        currentCustomState.addons.splice(idx, 1);
      } else {
        currentCustomState.addons.push(addonId);
      }
      renderCustomModalOptions();
    }

    function toggleNote(noteStr) {
      const idx = currentCustomState.notes.indexOf(noteStr);
      if (idx > -1) {
        currentCustomState.notes.splice(idx, 1);
      } else {
        currentCustomState.notes.push(noteStr);
      }
      renderCustomModalOptions();
    }

    function changeCustomModalQty(delta) {
      currentCustomState.qty = Math.max(1, currentCustomState.qty + delta);
      renderCustomModalOptions();
    }

    // 確認將客製化餐點加入購物車（相同品項+相同辣度加點與忌口會自動合併數量）
    function confirmAddCustomToCart() {
      const { item, spice, addons, notes, qty } = currentCustomState;
      if (!item) return;

      const sortedAddons = [...addons].sort();
      const sortedNotes = [...notes].sort();
      const selectedAddonsObjs = addonOptions.filter(a => sortedAddons.includes(a.id));
      const addonExtraPrice = selectedAddonsObjs.reduce((sum, a) => sum + a.price, 0);
      const unitPrice = item.price + addonExtraPrice;

      // 產生唯一規格識別鍵，讓相同客製規格自動合併份數
      const specKey = `${item.id}__${spice}__${sortedAddons.join(',')}__${sortedNotes.join(',')}`;

      const existingEntry = cartDetails.find(entry => entry.key === specKey);
      if (existingEntry) {
        existingEntry.qty += qty;
      } else {
        cartDetails.push({
          key: specKey,
          itemId: item.id,
          name: item.name,
          basePrice: item.price,
          unitPrice: unitPrice,
          spice: spice,
          addons: selectedAddonsObjs,
          notes: sortedNotes,
          qty: qty
        });
      }

      closeCustomModal();
      updateUI();
    }

    /**
     * 5. 在卡片上直接點擊 [-] 減少數量：
     * 自動從該品項最後加入的一筆客製化規格扣除 1 份；若歸零則移除該筆明細
     */
    function decreaseItemFromCard(itemId) {
      for (let i = cartDetails.length - 1; i >= 0; i--) {
        if (cartDetails[i].itemId === itemId) {
          cartDetails[i].qty -= 1;
          if (cartDetails[i].qty <= 0) {
            cartDetails.splice(i, 1);
          }
          break;
        }
      }
      updateUI();
    }

    // 在結帳明細彈窗內直接針對特定客製化規格增減數量
    function updateCartEntryByKey(specKey, delta) {
      const idx = cartDetails.findIndex(e => e.key === specKey);
      if (idx === -1) return;

      cartDetails[idx].qty += delta;
      if (cartDetails[idx].qty <= 0) {
        cartDetails.splice(idx, 1);
      }

      updateUI();

      // 若購物車已空則自動關閉明細彈窗，否則重新渲染明細表
      if (cartDetails.length === 0) {
        closeCheckoutModal();
      } else {
        renderCheckoutOrderList();
      }
    }

    /**
     * 6. 統一畫面更新函式（重新計算金額、更新卡片數量與 [-] 禁用狀態、更新底部浮動列）
     */
    function updateUI() {
      syncCartCounts();

      let totalQty = 0;
      let totalPrice = 0;

      cartDetails.forEach(entry => {
        totalQty += entry.qty;
        totalPrice += entry.qty * entry.unitPrice;
      });

      menuData.forEach(item => {
        const qty = cart[item.id] || 0;

        // 更新該卡片上的數量文字
        const qtyEl = document.getElementById(`qty-${item.id}`);
        if (qtyEl) {
          qtyEl.textContent = qty;
          qtyEl.className = qty > 0
            ? 'font-black text-base sm:text-lg text-orange-600 min-w-[2rem] text-center select-none'
            : 'font-black text-base sm:text-lg text-slate-800 min-w-[2rem] text-center select-none';
        }

        // 核心邏輯：當該品項數量為 0 時，[-] 按鈕加上 disabled 屬性；大於 0 時解除禁用
        const minusBtn = document.getElementById(`minus-${item.id}`);
        if (minusBtn) {
          minusBtn.disabled = (qty === 0);
        }
      });

      // 更新底部固定浮動列資訊
      document.getElementById('total-qty-badge').textContent = totalQty;
      document.getElementById('total-qty-text').textContent = totalQty;
      document.getElementById('total-price-text').textContent = totalPrice.toLocaleString();

      // 若目前總金額為 0，結帳按鈕與清空按鈕設為不可點選狀態
      const checkoutBtn = document.getElementById('checkout-btn');
      const resetBtn = document.getElementById('reset-btn');
      const isEmpty = (totalPrice === 0);

      checkoutBtn.disabled = isEmpty;
      resetBtn.disabled = isEmpty;
    }

    /**
     * 7. 清空購物車功能
     */
    function clearCart() {
      initCart();
      updateUI();
    }

    function clearCartWithConfirm() {
      if (confirm('確定要清空目前已選取的所有餐點嗎？')) {
        clearCart();
      }
    }

    /**
     * 8. 開啟與關閉結帳明細彈窗 (Checkout Modal)
     */
    function renderCheckoutOrderList() {
      const orderListEl = document.getElementById('modal-order-list');
      let totalQty = 0;
      let totalPrice = 0;

      // 僅列出數量大於 0 的品項與其客製化內容
      const activeEntries = cartDetails.filter(entry => entry.qty > 0);

      orderListEl.innerHTML = activeEntries.map(entry => {
        const subtotal = entry.qty * entry.unitPrice;
        totalQty += entry.qty;
        totalPrice += subtotal;

        const spiceBadgeClass = entry.spice === '不辣'
          ? 'bg-slate-100 text-slate-600'
          : 'bg-rose-50 text-rose-700 border border-rose-200/70';

        const addonBadges = entry.addons.length > 0
          ? entry.addons.map(a => `<span class="inline-block px-2 py-0.5 rounded bg-amber-50 text-orange-700 border border-amber-200/70 text-[11px] font-bold">+${a.name}($${a.price})</span>`).join(' ')
          : '';

        const noteBadges = entry.notes.length > 0
          ? entry.notes.map(n => `<span class="inline-block px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[11px] font-medium">${n}</span>`).join(' ')
          : '';

        return `
          <tr>
            <td class="py-3 pr-2">
              <div class="font-bold text-slate-800">${entry.name}</div>
              <div class="flex flex-wrap gap-1 mt-1">
                <span class="inline-block px-2 py-0.5 rounded text-[11px] font-bold ${spiceBadgeClass}">${entry.spice}</span>
                ${addonBadges}
                ${noteBadges}
              </div>
            </td>
            <td class="py-3 text-right text-slate-500 whitespace-nowrap align-top">NT$ ${entry.unitPrice}</td>
            <td class="py-3 text-center whitespace-nowrap align-top">
              <div class="inline-flex items-center gap-1.5 bg-slate-100 rounded-lg px-1.5 py-0.5">
                <button type="button"
                        onclick="updateCartEntryByKey('${entry.key}', -1)"
                        class="w-6 h-6 rounded bg-white text-slate-700 font-black text-xs shadow-sm active:scale-90">−</button>
                <span class="font-bold text-xs text-orange-700 min-w-[1.25rem] text-center">${entry.qty}</span>
                <button type="button"
                        onclick="updateCartEntryByKey('${entry.key}', 1)"
                        class="w-6 h-6 rounded bg-orange-500 text-white font-black text-xs shadow-sm active:scale-90">+</button>
              </div>
            </td>
            <td class="py-3 text-right font-extrabold text-slate-900 whitespace-nowrap align-top">NT$ ${subtotal.toLocaleString()}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('modal-total-qty').textContent = totalQty;
      document.getElementById('modal-total-price').textContent = totalPrice.toLocaleString();
    }

    function openCheckoutModal() {
      renderCheckoutOrderList();
      const modalEl = document.getElementById('checkout-modal');
      modalEl.classList.remove('hidden');
      modalEl.classList.add('flex');
    }

    function closeCheckoutModal() {
      const modalEl = document.getElementById('checkout-modal');
      modalEl.classList.add('hidden');
      modalEl.classList.remove('flex');
    }

    /**
     * 9. 確認送單：跳出原生 alert 提示總金額，確認後自動清空購物車與關閉彈窗
     */
    function submitOrder() {
      let totalPrice = 0;
      cartDetails.forEach(entry => {
        totalPrice += entry.qty * entry.unitPrice;
      });

      if (totalPrice <= 0) return;

      alert(`訂單已送出！總金額 NT$ ${totalPrice.toLocaleString()}`);
      clearCart();
      closeCheckoutModal();
    }

    // 網頁載入完成時初始化
    document.addEventListener('DOMContentLoaded', () => {
      initCart();
      renderMenuGrid();
      updateUI();
    });
  </script>
</body>
</html>
